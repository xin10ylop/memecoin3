# Second paper forward test: knife_catch (failure-autopsy inversion).
# Buy the first -35%-from-high break after a >=2x pump, timed exit.
# Hot-window evidence only (see research/mining/failure-autopsy.md);
# use_regime=1 sizes it to zero on cool tape. This paper run IS the
# clean forward window the autopsy demanded.

# VALIDATED 2026-08-28 (research/results/REPORT.md): the walk-forward pick
# was stable across folds — min_dip 0.35, use_regime 0, stop 0.35,
# 60-min hold — and survives 3x costs. Forward-testing exactly that spec.
strategy:
  name: knife_catch
  params: {use_regime: 0}

capital:
  starting_usd: 100.0
  risk_per_trade_usd: 25.0
  max_concurrent: 4
  max_exposure_frac: 0.5

exits:
  # validated pick: timed 60-min hold, 35% disaster stop, no trail/TP
  stop_frac: 0.35
  trail_frac: 0.90
  tp_levels: []
  max_hold_minutes: 60
  liquidity_drop_exit_frac: 0.5

safety:
  # match the VALIDATED population: the backtest family used only the
  # liquidity floor — the general fdv/vol floors would silently exclude
  # many legitimate knife events on small fresh graduates. On-chain
  # safety checks (authorities, concentration, sellability) stay fully on.
  min_liquidity_usd: 10000   # exactly the tested floor
  fdv_min_usd: 20000
  min_vol_h1_usd: 2000
  min_age_minutes: 15
  # PAPER-ONLY: public-RPC throttling makes holder reads flaky and was
  # blocking every entry for infra reasons. Live mode must never set this
  # (a Helius RPC key makes the read reliable instead).
  allow_unverified_holders: true

live:
  gt_rate_per_min: 6
  state_db: data/live_knife.db
  kill_file: data/KILL
