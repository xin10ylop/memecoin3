# Paper-trading config for the current forward test.
# Strategy: composite_v2 — the conjunction of every alpha-mining survivor
# (see research/mining/*.md): hysteresis regime gate, near-HWM momentum,
# turnover floor + wash cap, buyer flow/dominance, chop filter, no-chase.
# Its OOS sample is too small to validate (10 trades) — paper forward
# testing IS the experiment. Exits use the mined plateau via
# config/default.yaml (stop 0.15, trail 0.18, no TP, 300min hold).

strategy:
  name: composite_v2
  params: {}

capital:
  starting_usd: 100.0
  risk_per_trade_usd: 25.0
  max_concurrent: 4
  max_exposure_frac: 0.5

live:
  gt_rate_per_min: 8      # leave API budget to the collector on this host
  state_db: data/live.db
