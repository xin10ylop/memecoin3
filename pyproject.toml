[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memebot"
version = "0.1.0"
description = "Quant research + 24/7 trading system for Solana memecoins (paper-first)"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
    "numpy>=1.26",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
live = [
    "solders>=0.21",
    "base58>=2.1",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
memebot = "memebot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
